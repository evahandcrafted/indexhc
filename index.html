<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvaHandcrafted - Katalog Handcraft Imut</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for Cute Rounded Look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Quicksand:wght=500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #FFF0F5; /* Lavender Blush / Light Pink */
    }
    .font-cute {
      font-family: 'Fredoka', sans-serif;
    }
    
    /* Claymorphism Soft Style Effect */
    .clay-card {
      background: #ffffff;
      border: 4px solid #FFD1DC; /* Pastel Pink Border */
      border-radius: 24px;
      box-shadow: 
        inset -6px -6px 12px rgba(255, 182, 193, 0.4),
        inset 6px 6px 12px rgba(255, 255, 255, 0.9),
        8px 8px 20px rgba(255, 105, 180, 0.15);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .clay-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 
        inset -8px -8px 16px rgba(255, 182, 193, 0.5),
        inset 8px 8px 16px rgba(255, 255, 255, 0.9),
        12px 12px 24px rgba(255, 105, 180, 0.25);
    }

    .clay-btn {
      background: #FFB6C1; /* Light Pink */
      color: #FFFFFF;
      border: 3px solid #FF99AA;
      border-radius: 16px;
      box-shadow: 
        inset -4px -4px 8px rgba(219, 112, 147, 0.5),
        inset 4px 4px 8px rgba(255, 255, 255, 0.6),
        4px 4px 10px rgba(255, 105, 180, 0.2);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .clay-btn:hover {
      background: #FFA0B0;
      transform: translateY(2px);
      box-shadow: 
        inset -2px -2px 4px rgba(219, 112, 147, 0.6),
        inset 2px 2px 4px rgba(255, 255, 255, 0.7),
        2px 2px 5px rgba(255, 105, 180, 0.1);
    }

    .clay-btn-secondary {
      background: #FFF0F5;
      color: #FF69B4;
      border: 3px solid #FFC0CB;
      border-radius: 16px;
      box-shadow: 
        inset -4px -4px 8px rgba(255, 192, 203, 0.5),
        inset 4px 4px 8px rgba(255, 255, 255, 0.9),
        4px 4px 10px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .clay-btn-secondary:hover {
      background: #FFE4E1;
      transform: translateY(2px);
    }

    .clay-btn-danger {
      background: #FF8A8A;
      color: #FFFFFF;
      border: 3px solid #FF5C5C;
      border-radius: 16px;
      box-shadow: 
        inset -4px -4px 8px rgba(200, 50, 50, 0.4),
        inset 4px 4px 8px rgba(255, 255, 255, 0.6),
        4px 4px 10px rgba(255, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    .clay-btn-danger:hover {
      background: #FF7171;
      transform: translateY(2px);
    }

    .clay-input {
      background: #FFFFFF;
      border: 3px solid #FFD1DC;
      border-radius: 16px;
      box-shadow: 
        inset 3px 3px 6px rgba(255, 182, 193, 0.2),
        2px 2px 5px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }

    .clay-input:focus {
      outline: none;
      border-color: #FF69B4;
      box-shadow: 
        inset 3px 3px 6px rgba(255, 105, 180, 0.2),
        0 0 10px rgba(255, 105, 180, 0.2);
    }

    /* CSS Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }

    .animate-scaleUp {
      animation: scaleUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Loading Spinner */
    .loader {
      border: 4px solid #FFF0F5;
      border-top: 4px solid #FF69B4;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-neutral-700">

  <div id="root"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // =========================================================================
    // TEMPEL URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    // =========================================================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwq5WKeDQwjAgan8oGKJk46RKiIvJXBkQ2DV8jPQlB0dg5QGdYEQKpeSrw5fPm7D2HtXw/exec"; 
    // Ganti nilai di atas dengan URL Web App milik Anda yang di-deploy di GAS.

    function App() {
      // 1. STATE MANAGEMENT
      const [products, setProducts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [apiConnected, setApiConnected] = useState(false);
      const [apiError, setApiError] = useState(''); // State untuk menangkap detail error teknis
      
      // New: Simulasi Demo Offline state (agar user bisa langsung simulasi di Preview!)
      const [isDemoMode, setIsDemoMode] = useState(false);
      const [demoCredentials, setDemoCredentials] = useState({ username: "admin", password: "eva123" });

      // State pencarian & filter navigasi
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [sortBy, setSortBy] = useState('terkait');
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [zoomedImage, setZoomedImage] = useState(null); // State Zoom Gambar Produk

      // State Edit Produk
      const [isEditing, setIsEditing] = useState(false);
      const [editingProductId, setEditingProductId] = useState(null);
      const [editingProductViews, setEditingProductViews] = useState(0);
      
      // State autentikasi admin panel
      const [showAdminPanel, setShowAdminPanel] = useState(false);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [showPasswordText, setShowPasswordText] = useState(false);

      // State khusus penanganan Error Deploy GAS Caching
      const [showGasVersionAlert, setShowGasVersionAlert] = useState(false);
      
      // Form Login Admin
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      // Form Ubah Kredensial Admin
      const [currentPassConfirm, setCurrentPassConfirm] = useState('');
      const [newAdminUser, setNewAdminUser] = useState('');
      const [newAdminPass, setNewAdminPass] = useState('');

      // State data input form produk
      const [newTitle, setNewTitle] = useState('');
      const [newPrice, setNewPrice] = useState('');
      const [newCategory, setNewCategory] = useState('');
      const [newImage, setNewImage] = useState('');
      const [newDesc, setNewDesc] = useState('');
      
      // Form Tambah Kategori Baru
      const [newCategoryInput, setNewCategoryInput] = useState('');

      // Notifikasi / Toast
      const [adminNotification, setAdminNotification] = useState('');

      // Custom Confirmation Modal State
      const [confirmModal, setConfirmModal] = useState({
        show: false,
        title: '',
        message: '',
        onConfirm: null
      });

      // ==========================================
      // FUNGSI DIAGNOSIS FORMAT URL (ANALYZER)
      // ==========================================
      const runUrlDiagnosis = (url) => {
        if (!url || url.trim() === "") {
          return { valid: false, code: "EMPTY", message: "Variabel GAS_API_URL masih kosong." };
        }
        if (url.includes("YOUR_GOOGLE_APPS_SCRIPT_URL_HERE")) {
          return { valid: false, code: "PLACEHOLDER", message: "Anda masih menggunakan URL template bawaan! Harap ganti dengan URL milik Anda." };
        }
        if (!url.startsWith("https://script.google.com/")) {
          return { valid: false, code: "NOT_GOOGLE", message: "URL tidak valid. Harus dimulai dengan 'https://script.google.com/'" };
        }
        if (url.includes("/edit") || url.includes("/d/")) {
          return { valid: false, code: "EDITOR_LINK", message: "Anda memasukkan link Editor Script/Spreadsheet! Harap lakukan deploy ulang lalu salin link Web App yang berakhiran '/exec'." };
        }
        if (!url.includes("/macros/s/") || !url.endsWith("/exec")) {
          return { valid: false, code: "BAD_FORMAT", message: "Format URL Web App kurang tepat. Pastikan link mengandung '/macros/s/' dan diakhiri dengan '/exec'." };
        }
        return { valid: true, code: "OK", message: "Format URL Web App tampak sudah benar!" };
      };

      const diagnosis = runUrlDiagnosis(GAS_API_URL);

      // ==========================================
      // FETCH DATA AWAL DARI GOOGLE APPS SCRIPT
      // ==========================================
      const loadDatabase = async (forceDemo = false) => {
        if (forceDemo) {
          // Aktifkan mode simulasi demo offline tanpa spreadsheet
          setIsDemoMode(true);
          setProducts([
            {id: 1607604276001, title: "Gantungan Kunci Clay Awan Lucu", price: 25000, category: "Gantungan Kunci", image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500", rating: 5.0, sold: 0, description: "Gantungan kunci awan imut handmade yang dibuat dari air dry clay berkualitas tinggi."},
            {id: 1607604276002, title: "Piring Perhiasan Keramik Estetik Tulip", price: 48000, category: "Dekorasi Rumah", image: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=500", rating: 5.0, sold: 0, description: "Piring kecil serbaguna untuk meletakkan cincin, kalung, atau anting dengan hiasan bunga tulip."},
            {id: 1607604276003, title: "Cincin Manik-Manik Colorful Clay Daisy", price: 12000, category: "Aksesoris", image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=500", rating: 5.0, sold: 0, description: "Cincin manik-manik elastis dengan hiasan bunga daisy clay di tengahnya."},
            {id: 1607604276004, title: "Cermin Meja Hias Bingkai Foam Clay", price: 75000, category: "Dekorasi Rumah", image: "https://images.unsplash.com/photo-1618220179428-22790b461013?w=500", rating: 5.0, sold: 0, description: "Cermin estetik dengan bingkai bertekstur empuk mirip awan berbahan clay busa."}
          ]);
          setCategories(["Gantungan Kunci", "Dekorasi Rumah", "Aksesoris"]);
          setApiConnected(true);
          setIsLoading(false);
          return;
        }

        if (!diagnosis.valid) {
          setIsLoading(false);
          setApiConnected(false);
          setApiError(diagnosis.message);
          return;
        }

        setIsLoading(true);
        setApiError('');
        try {
          const response = await fetch(GAS_API_URL);
          if (!response.ok) {
            throw new Error(`Server merespon dengan status HTTP ${response.status}`);
          }
          const result = await response.json();
          if (result.status === "success") {
            setProducts(result.products || []);
            setCategories(result.categories || []);
            setApiConnected(true);
          } else {
            throw new Error(result.message || "Gagal memproses data dari spreadsheet.");
          }
        } catch (error) {
          console.error("Gagal terhubung dengan server GAS API:", error);
          setApiConnected(false);
          setApiError(error.toString());
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        loadDatabase();
      }, []);

      // Set default category on product form once categories are initialized
      useEffect(() => {
        if (categories.length > 0 && !newCategory) {
          setNewCategory(categories[0]);
        }
      }, [categories]);

      // ==========================================
      // MANAJEMEN ICON (Lucide)
      // ==========================================
      useEffect(() => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }, [showAdminPanel, showPasswordModal, selectedProduct, products, categories, loginError, adminNotification, showPasswordText, confirmModal, isLoading, apiConnected, apiError, isDemoMode, isEditing, zoomedImage, showGasVersionAlert]);

      // ==========================================
      // LOGIKA FILTER & SORTING
      // ==========================================
      const filteredProducts = products.filter(product => {
        const matchesSearch = product.title.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === 'Semua' || product.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      const sortedProducts = [...filteredProducts].sort((a, b) => {
        if (sortBy === 'terlaris') return b.sold - a.sold;
        if (sortBy === 'termurah') return a.price - b.price;
        if (sortBy === 'termahal') return b.price - a.price;
        return b.id - a.id; // Terkait / Produk Terbaru
      });

      // ==========================================
      // INTEGRASI POST REQUEST KE GOOGLE SHEETS
      // ==========================================
      const sendPostRequest = async (payload) => {
        if (isDemoMode) {
          setIsLoading(true);
          await new Promise(resolve => setTimeout(resolve, 600));
          setIsLoading(false);

          if (payload.action === "admin_login") {
            if (payload.username === demoCredentials.username && payload.password === demoCredentials.password) {
              return { status: "success", authorized: true };
            } else {
              return { status: "error", authorized: false, message: "Username atau password salah!" };
            }
          }

          if (payload.action === "update_credentials") {
            if (payload.currentPassword !== demoCredentials.password) {
              return { status: "error", message: "Password verifikasi saat ini salah!" };
            }
            setDemoCredentials({ username: payload.newUsername, password: payload.newPassword });
            return { status: "success", message: "Kredensial admin simulasi berhasil diperbarui!" };
          }

          return { status: "success" };
        }

        try {
          setIsLoading(true);
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          return result;
        } catch (error) {
          console.error("Kesalahan koneksi POST GAS API:", error);
          showAdminToast("❌ Terjadi masalah koneksi ke server Spreadsheet.");
          return { status: "error", message: error.toString() };
        } finally {
          setIsLoading(false);
        }
      };

      // ==========================================
      // PENAMBAHAN VIEW COUNT SECARA DINAMIS
      // ==========================================
      const handleOpenProductDetail = async (product) => {
        const updatedViews = (product.sold || 0) + 1;
        const updatedProduct = { ...product, sold: updatedViews };

        setProducts(prevProducts => prevProducts.map(p => p.id === product.id ? updatedProduct : p));
        setSelectedProduct(updatedProduct);

        if (isDemoMode) {
          // Hanya simulasi lokal
        } else if (apiConnected) {
          try {
            fetch(GAS_API_URL, {
              method: "POST",
              mode: "cors",
              headers: {
                "Content-Type": "text/plain;charset=utf-8",
              },
              body: JSON.stringify({
                action: "update_product",
                product: updatedProduct
              })
            });
          } catch (e) {
            console.error("Gagal memperbarui jumlah penayangan di spreadsheet:", e);
          }
        }
      };

      // ==========================================
      // PROSES LOGIN & LOGOUT ADMIN
      // ==========================================
      const handleAdminToggleClick = () => {
        if (showAdminPanel) {
          setShowAdminPanel(false);
        } else {
          if (!isAdminAuthenticated) {
            setShowPasswordModal(true);
          } else {
            setShowAdminPanel(true);
          }
        }
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        
        const payload = {
          action: "admin_login",
          username: loginUser,
          password: loginPass
        };

        const result = await sendPostRequest(payload);
        if (result.status === "success" && (result.authorized || isDemoMode)) {
          setIsAdminAuthenticated(true);
          setShowPasswordModal(false);
          setShowAdminPanel(true);
          setLoginUser('');
          setLoginPass('');
          showAdminToast("🔓 Selamat Datang, Owner EvaHandcrafted!");
        } else {
          setLoginError(result.message || 'Kredensial salah!');
        }
      };

      const handleLogoutAdmin = () => {
        setIsAdminAuthenticated(false);
        setShowAdminPanel(false);
        setIsEditing(false);
        resetProductForm();
        showAdminToast("🔒 Anda telah keluar dari mode admin.");
      };

      // ==========================================
      // EDIT KREDENSIAL ADMIN SPREADSHEET
      // ==========================================
      const handleUpdateCredentials = async (e) => {
        e.preventDefault();
        const nextUser = newAdminUser.trim();
        const nextPass = newAdminPass.trim();

        if (!nextUser || !nextPass) {
          showAdminToast("❌ Username dan password baru tidak boleh kosong!");
          return;
        }

        const payload = {
          action: "update_credentials",
          currentPassword: currentPassConfirm,
          newUsername: nextUser,
          newPassword: nextPass
        };

        const result = await sendPostRequest(payload);
        if (result.status === "success") {
          setCurrentPassConfirm('');
          setNewAdminUser('');
          setNewAdminPass('');
          showAdminToast(isDemoMode ? "✅ Akun Admin berhasil diperbarui lokal (Simulasi)!" : "✅ Akun Admin berhasil diperbarui di Google Sheets!");
        } else {
          showAdminToast(`❌ Gagal: ${result.message}`);
        }
      };

      // ==========================================
      // MANAJEMEN PRODUK SPREADSHEET (TAMBAH & EDIT)
      // ==========================================
      const handleAddOrEditProduct = async (e) => {
        e.preventDefault();
        if (!newTitle || !newPrice) {
          showAdminToast("❌ Mohon isi judul dan harga produk!");
          return;
        }

        const priceNum = parseFloat(newPrice);
        if (isNaN(priceNum) || priceNum <= 0) {
          showAdminToast("❌ Harga harus berupa angka positif!");
          return;
        }

        const finalImage = newImage.trim() !== "" ? newImage : "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500";

        if (isEditing) {
          const updatedProduct = {
            id: editingProductId,
            title: newTitle,
            price: priceNum,
            category: newCategory || categories[0],
            image: finalImage,
            rating: 5.0,
            sold: editingProductViews,
            description: newDesc || "Tidak ada deskripsi tambahan untuk kerajinan tangan imut ini."
          };

          const payload = {
            action: "update_product",
            product: updatedProduct
          };

          const result = await sendPostRequest(payload);
          
          // DETEKSI ERROR CACHING: "Aksi tidak dikenali atau tidak valid"
          if (result.status === "error" && result.message.includes("tidak dikenali")) {
            setShowGasVersionAlert(true); // Tampilkan panduan cara mengatasi caching GAS
            return;
          }

          if (result.status === "success") {
            showAdminToast("✨ Perubahan produk berhasil disimpan!");
            setProducts(prevProducts => prevProducts.map(p => p.id === editingProductId ? updatedProduct : p));
            resetProductForm();
            if (!isDemoMode) await loadDatabase();
          } else {
            showAdminToast(`❌ Gagal memperbarui: ${result.message}`);
          }

        } else {
          const newProduct = {
            id: Date.now(),
            title: newTitle,
            price: priceNum,
            category: newCategory || categories[0],
            image: finalImage,
            rating: 5.0,
            sold: 0,
            description: newDesc || "Tidak ada deskripsi tambahan untuk kerajinan tangan imut ini."
          };

          const payload = {
            action: "add_product",
            product: newProduct
          };

          const result = await sendPostRequest(payload);
          if (result.status === "success") {
            showAdminToast(isDemoMode ? "✨ Produk baru sukses ditambahkan secara lokal!" : "✨ Produk baru sukses disimpan di Google Sheets!");
            setProducts(prevProducts => [...prevProducts, newProduct]);
            resetProductForm();
            if (!isDemoMode) await loadDatabase();
          } else {
            showAdminToast(`❌ Gagal menyimpan: ${result.message}`);
          }
        }
      };

      const handleEditClick = (product) => {
        setIsEditing(true);
        setEditingProductId(product.id);
        setEditingProductViews(product.sold || 0);
        
        setNewTitle(product.title);
        setNewPrice(product.price);
        setNewCategory(product.category);
        setNewImage(product.image);
        setNewDesc(product.description);
        
        showAdminToast(`📝 Mode Edit: "${product.title}"`);
        window.scrollTo({ top: 120, behavior: 'smooth' });
      };

      const handleCancelEdit = () => {
        resetProductForm();
        showAdminToast("ℹ️ Mode edit dibatalkan.");
      };

      const resetProductForm = () => {
        setIsEditing(false);
        setEditingProductId(null);
        setEditingProductViews(0);
        setNewTitle('');
        setNewPrice('');
        setNewImage('');
        setNewDesc('');
        if (categories.length > 0) {
          setNewCategory(categories[0]);
        }
      };

      const handleDeleteProduct = (id) => {
        setConfirmModal({
          show: true,
          title: 'Hapus Produk dari Katalog?',
          message: isDemoMode ? 'Hapus produk ini secara lokal?' : 'Apakah Anda yakin ingin menghapus produk ini secara permanen dari Google Sheets?',
          onConfirm: async () => {
            const payload = {
              action: "delete_product",
              productId: id
            };
            const result = await sendPostRequest(payload);
            if (result.status === "success") {
              showAdminToast("🗑️ Produk berhasil dihapus.");
              setProducts(prevProducts => prevProducts.filter(p => p.id !== id));
              if (isEditing && editingProductId === id) {
                resetProductForm();
              }
              if (!isDemoMode) await loadDatabase();
            } else {
              showAdminToast(`❌ Gagal menghapus: ${result.message}`);
            }
          }
        });
      };

      // ==========================================
      // MANAJEMEN KATEGORI SPREADSHEET
      // ==========================================
      const handleAddCategory = async (e) => {
        e.preventDefault();
        const cleanCategory = newCategoryInput.trim();
        if (!cleanCategory) return;

        if (categories.some(cat => cat.toLowerCase() === cleanCategory.toLowerCase())) {
          showAdminToast("⚠️ Kategori tersebut sudah terdaftar!");
          return;
        }

        const payload = {
          action: "add_category",
          categoryName: cleanCategory
        };

        const result = await sendPostRequest(payload);
        if (result.status === "success") {
          setNewCategoryInput('');
          showAdminToast(`✨ Kategori "${cleanCategory}" berhasil disimpan!`);
          setCategories(prevCategories => [...prevCategories, cleanCategory]);
          if (!isDemoMode) await loadDatabase();
        } else {
          showAdminToast(`❌ Gagal menyimpan kategori: ${result.message}`);
        }
      };

      const handleDeleteCategory = (catToDelete) => {
        setConfirmModal({
          show: true,
          title: `Hapus Kategori "${catToDelete}"?`,
          message: 'Kategori akan dihapus secara permanen dari daftar.',
          onConfirm: async () => {
            const payload = {
              action: "delete_category",
              categoryName: catToDelete
            };
            const result = await sendPostRequest(payload);

                  <div className="bg-white p-3 rounded-2xl border-2 border-pink-100 flex flex-wrap items-center justify-between gap-4 text-sm">
                    <div className="flex items-center gap-3">
                      <span className="text-neutral-400 font-medium">Urutkan:</span>
                      <div className="flex flex-wrap gap-2">
                        <button 
                          onClick={() => setSortBy('terkait')} 
                          className={`px-4 py-1.5 rounded-lg font-bold ${sortBy === 'terkait' ? 'bg-[#FFD1DC] text-[#FF69B4]' : 'bg-neutral-50 text-neutral-500 hover:bg-neutral-100'}`}
                        >
                          Terbaru
                        </button>
                        <button 
                          onClick={() => setSortBy('terlaris')} 
                          className={`px-4 py-1.5 rounded-lg font-bold ${sortBy === 'terlaris' ? 'bg-[#FFD1DC] text-[#FF69B4]' : 'bg-neutral-50 text-neutral-500 hover:bg-neutral-100'}`}
                        >
                          Paling Banyak Dilihat
                        </button>
                      </div>
                    </div>

                    <div>
                      <select 
                        className="px-3 py-1.5 rounded-lg border-2 border-pink-100 bg-white font-bold text-neutral-600 outline-none cursor-pointer"
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                      >
                        <option value="terkait">Terbaru (Default)</option>
                        <option value="termurah">Harga: Rendah ke Tinggi</option>
                        <option value="termahal">Harga: Tinggi ke Rendah</option>
                      </select>
                    </div>
                  </div>

                  {/* GRID PRODUK KATALOG */}
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                    {sortedProducts.map((product) => (
                      <div 
                        key={product.id} 
                        className="clay-card flex flex-col justify-between overflow-hidden cursor-pointer bg-white"
                        onClick={() => handleOpenProductDetail(product)}
                      >
                        {/* Image Frame */}
                        <div className="aspect-square w-full overflow-hidden relative bg-[#FFF0F5]">
                          <img 
                            src={product.image} 
                            alt={product.title} 
                            className="w-full h-full object-cover" 
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src = "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500";
                            }}
                          />
                          <div className="absolute top-2 left-2 bg-[#FFB6C1]/90 backdrop-blur-xs text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                            {product.category}
                          </div>
                        </div>

                        {/* Info Details */}
                        <div className="p-3 md:p-4 flex flex-col flex-grow justify-between space-y-2">
                          <div className="space-y-1">
                            <h4 className="text-sm font-semibold text-neutral-800 line-clamp-2 min-h-[40px]">
                              {product.title}
                            </h4>
                            
                            {/* View Count (Tanpa Rating) */}
                            <div className="flex items-center gap-1.5 text-xs text-neutral-500">
                              <i data-lucide="eye" className="w-3.5 h-3.5 text-[#FF69B4]"></i>
                              <span>{product.sold || 0}x dilihat</span>
                            </div>
                          </div>

                          <div className="space-y-2 pt-2 border-t border-pink-50">
                            {/* Harga */}
                            <div className="text-base font-bold text-[#FF69B4] font-cute">
                              {formatRupiah(product.price)}
                            </div>
                            
                            {/* Tombol Lihat Detail */}
                            <button 
                              className="w-full py-1.5 clay-btn-secondary text-xs font-bold flex items-center justify-center gap-1"
                            >
                              <i data-lucide="eye" className="w-3.5 h-3.5"></i> Lihat Detail
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* KONDISI JIKA PENCARIAN KOSONG */}
                  {sortedProducts.length === 0 && (
                    <div className="text-center py-20 bg-white rounded-3xl border-4 border-dashed border-[#FFD1DC] p-8 max-w-md mx-auto">
                      <span className="text-5xl">😭</span>
                      <h3 className="text-lg font-bold font-cute text-[#FF69B4] mt-4">Produk Tidak Ditemukan</h3>
                      <p className="text-sm text-neutral-500 mt-2">
                        Maaf, kami tidak bisa menemukan kerajinan tangan "{searchTerm}" di kategori {selectedCategory}. Coba kata kunci lainnya ya!
                      </p>
                      <button 
                        onClick={() => { setSearchTerm(''); setSelectedCategory('Semua'); }}
                        className="mt-4 px-4 py-2 font-bold clay-btn text-xs"
                      >
                        Reset Filter Pencarian
                      </button>
                    </div>
                  )}

                </div>
              )}

            </main>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t-4 border-[#FFD1DC] mt-8 py-8 px-4 text-center">
            <div className="max-w-6xl mx-auto space-y-4">
              <div className="flex justify-center items-center gap-2">
                <span className="text-2xl">💖</span>
                <span className="text-xl font-cute font-bold text-[#FF69B4]">EvaHandcrafted</span>
              </div>
              <p className="text-sm text-neutral-400 max-w-md mx-auto">
                Katalog resmi kerajinan tangan handmade premium. Semua produk merupakan dekorasi buatan tangan.
              </p>
              
              {/* Media Sosial & Tautan Admin Sejajar */}
              <div className="flex flex-col sm:flex-row items-center justify-between border-t border-pink-100 pt-6 mt-6 gap-4">
                <p className="text-xs text-neutral-400">
                  &copy; 2026 EvaHandcrafted. Design Website by Bismo Art .
                </p>
                
                <div className="flex items-center gap-4">
                  {/* Subtle Admin Access Toggle Link */}
                  {!showAdminPanel && apiConnected && (
                    <button 
                      onClick={handleAdminToggleClick} 
                      className="text-xs text-neutral-400 hover:text-[#FF69B4] hover:underline transition-colors focus:outline-none flex items-center gap-1 bg-neutral-50 hover:bg-pink-50 border border-neutral-200 hover:border-pink-200 py-1 px-3 rounded-full"
                    >
                      <i data-lucide="lock" className="w-3.5 h-3.5"></i>
                      <span>Akses Admin</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </footer>

          {/* MODAL PASSWORD ADMIN (POP-UP) */}
          {showPasswordModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fadeIn">
              <div className="clay-card bg-white max-w-sm w-full p-6 relative animate-scaleUp text-center">
                
                {/* Tombol Tutup */}
                <button 
                  onClick={() => { setShowPasswordModal(false); setLoginUser(''); setLoginPass(''); setLoginError(''); setShowPasswordText(false); }} 
                  className="absolute top-4 right-4 p-1.5 rounded-full hover:bg-neutral-100 text-neutral-400 hover:text-neutral-600 transition-colors"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center border-4 border-pink-200 mx-auto mb-4">
                  <i data-lucide="lock" className="w-8 h-8 text-[#FF69B4]"></i>
                </div>

                <h3 className="text-xl font-bold font-cute text-[#FF69B4] mb-2">Akses Terkunci</h3>
                <p className="text-xs text-neutral-400 mb-4">
                  Silakan masukkan akun admin Anda untuk mengelola etalase EvaHandcrafted. <br/>
                  {isDemoMode && <strong className="text-[#FF69B4]">Simulasi Login default: admin / eva123</strong>}
                </p>

                <form onSubmit={handleLoginSubmit} className="space-y-3 text-left">
                  <div>
                    <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-1 pl-1">Username</label>
                    <input 
                      type="text" 
                      placeholder="Username Admin" 
                      className="w-full p-2.5 clay-input text-sm font-semibold"
                      value={loginUser}
                      onChange={(e) => setLoginUser(e.target.value)}
                      required
                    />
                  </div>
                  
                  <div>
                    <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-wider mb-1 pl-1">Password</label>
                    <div className="relative flex items-center">
                      <input 
                        type={showPasswordText ? "text" : "password"} 
                        placeholder="Password Admin" 
                        className="w-full p-2.5 pr-10 clay-input text-sm font-semibold tracking-wider"
                        value={loginPass}
                        onChange={(e) => setLoginPass(e.target.value)}
                        required
                      />
                      <button
                        type="button"
                        onClick={() => setShowPasswordText(!showPasswordText)}
                        className="absolute right-3 text-neutral-400 hover:text-[#FF69B4] transition-colors focus:outline-none"
                      >
                        <i data-lucide={showPasswordText ? "eye-off" : "eye"} className="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  {loginError && (
                    <p className="text-xs text-red-500 font-bold text-center mt-1">{loginError}</p>
                  )}
                  
                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => { setShowPasswordModal(false); setLoginUser(''); setLoginPass(''); setLoginError(''); setShowPasswordText(false); }}
                      className="flex-1 py-2.5 font-bold text-xs clay-btn-secondary"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-2.5 font-bold text-xs clay-btn"
                    >
                      Buka Akses 🔓
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* MODAL DETAIL PRODUK */}
          {selectedProduct && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fadeIn"
              onClick={() => setSelectedProduct(null)}
            >
              <div 
                className="clay-card bg-white max-w-lg w-full overflow-hidden p-6 relative animate-scaleUp"
                onClick={(e) => e.stopPropagation()}
              >
                
                {/* Tombol Tutup Silang Atas */}
                <button 
                  onClick={() => setSelectedProduct(null)} 
                  className="absolute top-4 right-4 p-2 rounded-full hover:bg-neutral-100 text-neutral-400 hover:text-neutral-600 transition-colors"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                {/* Konten Detail */}
                <div className="space-y-4">
                  
                  {/* Foto Detail Interaktif Klik Untuk Zoom */}
                  <div className="relative group aspect-video w-full overflow-hidden rounded-2xl border-4 border-pink-100 cursor-zoom-in" onClick={() => setZoomedImage(selectedProduct.image)}>
                    <img 
                      src={selectedProduct.image} 
                      alt={selectedProduct.title} 
                      className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" 
                    />
                    <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white text-xs font-bold gap-1.5">
                      <i data-lucide="zoom-in" className="w-4 h-4"></i>
                      Klik Gambar Untuk Memperbesar
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="flex items-center gap-2">
                      <span className="bg-pink-100 text-[#FF69B4] text-xs font-bold px-2.5 py-1 rounded-full">
                        {selectedProduct.category}
                      </span>
                    </div>

                    <h3 className="text-xl font-bold text-neutral-800 leading-tight">
                      {selectedProduct.title}
                    </h3>

                    {/* Harga & Views */}
                    <div className="flex items-center justify-between py-2 border-y-2 border-pink-50">
                      <div className="text-2xl font-bold text-[#FF69B4] font-cute">
                        {formatRupiah(selectedProduct.price)}
                      </div>
                      <div className="flex items-center gap-1.5 text-sm font-semibold text-neutral-500">
                        <i data-lucide="eye" className="w-4 h-4 text-[#FF69B4]"></i>
                        <span>{selectedProduct.sold || 0}x dilihat</span>
                      </div>
                    </div>

                    {/* Deskripsi */}
                    <div className="space-y-1">
                      <span className="text-xs font-bold text-neutral-400 uppercase tracking-wider">Deskripsi Produk:</span>
                      <p className="text-sm text-neutral-600 leading-relaxed max-h-36 overflow-y-auto pr-1">
                        {selectedProduct.description}
                      </p>
                    </div>

                    {/* Hubungi Penjual - Dua Kontak Admin */}
                    <div className="pt-4 space-y-3">
                      <span className="text-xs font-bold text-neutral-400 uppercase tracking-wider block text-center">Hubungi Admin Untuk Pemesanan:</span>
                      
                      <div className="flex flex-col sm:flex-row gap-3">
                        {/* Admin 1 */}
                        <a 
                          href={`https://wa.me/6281994347002?text=Halo%20EvaHandcrafted%20Admin%201%2C%20saya%20tertarik%20dengan%20produk%20"${encodeURIComponent(selectedProduct.title)}"%20seharga%20${formatRupiah(selectedProduct.price)}.%20Apakah%20stoknya%20ready%3F`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex-1 py-3 font-bold clay-btn flex items-center justify-center gap-2 text-sm bg-[#FFB6C1] border-[#FF99AA]"
                        >
                          <i data-lucide="phone-call" className="w-5 h-5"></i> Admin 1 (Mbak Eva)
                        </a>

                        {/* Admin 2 */}
                        <a 
                          href={`https://wa.me/6282332648110?text=Halo%20EvaHandcrafted%20Admin%202%2C%20saya%20tertarik%20dengan%20produk%20"${encodeURIComponent(selectedProduct.title)}"%20seharga%20${formatRupiah(selectedProduct.price)}.%20Apakah%20stoknya%20ready%3F`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex-1 py-3 font-bold clay-btn-secondary flex items-center justify-center gap-2 text-sm border-[#FFC0CB]"
                        >
                          <i data-lucide="phone-call" className="w-5 h-5"></i> Admin 2 (Asisten)
                        </a>
                      </div>

                      {/* Tombol Tutup Detail */}
                      <button 
                        onClick={() => setSelectedProduct(null)}
                        className="w-full py-2.5 mt-2 font-bold text-xs text-neutral-400 hover:text-neutral-600 bg-neutral-100 hover:bg-neutral-200 rounded-xl transition-all flex items-center justify-center gap-1.5"
                      >
                        <i data-lucide="x" className="w-4 h-4"></i> Tutup Detail
                      </button>
                    </div>

                  </div>
                </div>

              </div>
            </div>
          )}

          {/* MODAL ZOOM GAMBAR PRODUK (FULL-SCREEN LIGHTBOX) */}
          {zoomedImage && (
            <div 
              className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn cursor-zoom-out"
              onClick={() => setZoomedImage(null)}
            >
              <div className="relative max-w-4xl w-full max-h-[85vh] flex items-center justify-center animate-scaleUp" onClick={(e) => e.stopPropagation()}>
                {/* Tombol Close */}
                <button 
                  onClick={() => setZoomedImage(null)}
                  className="absolute -top-14 right-0 bg-white/10 hover:bg-white/20 p-2.5 rounded-full text-white transition-colors cursor-pointer"
                >
                  <i data-lucide="x" className="w-6 h-6"></i>
                </button>
                <img 
                  src={zoomedImage} 
                  alt="Zoom Gambar Produk" 
                  className="max-w-full max-h-[80vh] object-contain rounded-2xl border-4 border-pink-100/30 shadow-2xl" 
                />
              </div>
            </div>
          )}

          {/* MODAL DETEKSI ERROR CACHING GOOGLE APPS SCRIPT (PENTING JIKA GAS USER BELUM DI-REDEPLOY) */}
          {showGasVersionAlert && (
            <div className="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fadeIn">
              <div className="clay-card bg-white max-w-lg w-full p-6 relative animate-scaleUp text-left space-y-4">
                <div className="flex items-center gap-3 border-b-2 border-red-100 pb-3">
                  <span className="text-3xl">⚠️</span>
                  <div>
                    <h3 className="text-lg font-bold font-cute text-red-500">Langkah Otorisasi Tertunda!</h3>
                    <p className="text-xs text-neutral-400">Server Spreadsheet Anda menolak perintah 'update_product'.</p>
                  </div>
                </div>
                
                <div className="text-xs text-neutral-600 space-y-3 leading-relaxed">
                  <p>
                    Hal ini terjadi karena link Web App Anda masih terhubung dengan kode <strong>Spreadsheet versi lama</strong>. Di Google Apps Script, sekadar menekan simpan saja tidak cukup. Anda harus melakukan <strong>Redeploy Versi Baru</strong>.
                  </p>
                  <div className="bg-red-50 p-3 rounded-xl border border-red-100 space-y-1.5 text-[11px] text-red-700">
                    <p className="font-bold">📋 Cara Mengatasi (Kurang dari 1 Menit):</p>
                    <ol className="list-decimal list-inside space-y-1">
                      <li>Buka halaman editor <strong>Google Apps Script</strong> Anda.</li>
                      <li>Pastikan Anda sudah menempel kode terbaru dari file <code>kode.gs</code> yang saya berikan.</li>
                      <li>Di pojok kanan atas, klik tombol biru <strong>Deploy (Terapkan)</strong> &gt; pilih <strong>Manage deployments (Kelola penerapan)</strong>.</li>
                      <li>Klik ikon <strong>Pensil (Edit)</strong> di pojok kanan atas pop-up.</li>
                      <li>Pada menu dropdown <strong>Version (Versi)</strong>, ubah dan pilih <strong>New version (Versi baru)</strong>. <span className="font-bold underline">(Langkah ini wajib!)</span></li>
                      <li>Klik tombol <strong>Deploy</strong> yang berada di pojok kanan bawah.</li>
                    </ol>
                  </div>
                  <p className="text-[11px] text-neutral-400">
                    Setelah melakukan langkah di atas, silakan kembali ke website ini, segarkan halaman, dan edit kembali produk Anda. Perubahan akan tersimpan dengan lancar!
                  </p>
                </div>

                <div className="flex gap-2.5 pt-2">
                  <button 
                    onClick={() => {
                      // Aktifkan mode simulasi lokal agar user tetap bisa melihat cara kerjanya jika terburu-buru
                      setIsDemoMode(true);
                      setShowGasVersionAlert(false);
                      showAdminToast("⭐ Mode simulasi diaktifkan sementara agar Anda dapat mencoba mengedit.");
                    }}
                    className="flex-1 py-2.5 text-xs font-bold clay-btn-secondary"
                  >
                    Gunakan Mode Simulasi
                  </button>
                  <button 
                    onClick={() => setShowGasVersionAlert(false)}
                    className="flex-1 py-2.5 text-xs font-bold clay-btn"
                  >
                    Saya Paham, Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CUSTOM CLAY CONFIRMATION MODAL */}
          {confirmModal.show && (
            <div className="fixed inset-0 z-55 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fadeIn">
              <div className="clay-card bg-white max-w-sm w-full p-6 text-center animate-scaleUp">
                <span className="text-4xl">⚠️</span>
                <h3 className="text-lg font-bold font-cute text-[#FF69B4] mt-2 mb-1">{confirmModal.title}</h3>
                <p className="text-sm text-neutral-500 mb-4">{confirmModal.message}</p>
                
                <div className="flex gap-2">
                  <button 
                    onClick={() => setConfirmModal({ ...confirmModal, show: false })}
                    className="flex-1 py-2.5 font-bold text-xs clay-btn-secondary"
                  >
                    Batal
                  </button>
                  <button 
                    onClick={() => {
                      if (confirmModal.onConfirm) confirmModal.onConfirm();
                      setConfirmModal({ ...confirmModal, show: false });
                    }}
                    className="flex-1 py-2.5 font-bold text-xs clay-btn-danger"
                  >
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
